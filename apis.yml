apis:
- name: 500px Legacy API (v1)
  description: >-
    500px v1 REST API providing programmatic access to photo feature streams, photo information
    and comments, user profiles, galleries, and uploads. Responses are JSON; authentication uses
    OAuth 1.0a for user-scoped requests and a Consumer Key for public read-only requests. This
    public API program was discontinued on 2018-06-15 and is retained here as historical
    documentation.
