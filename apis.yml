aid: 500px
name: 500px
description: >-
  500px is an online photography community and stock-licensing platform where millions of
  photographers from over 195 countries showcase, discover, and license high-quality images.
  Founded in Toronto in 2009 and acquired by Visual China Group (VCG) in 2018, 500px combines a
  social network for photographers with a Licensing marketplace and Quest photo contests. 500px
  historically operated a public REST API (api.500px.com/v1) that exposed photo feeds, photo and
  comment data, user profiles, galleries, and uploads using OAuth 1.0a and Consumer Key
  authentication; that public API program was discontinued on June 15, 2018, and the platform is
  now community- and web-first. This profile documents the retired API surface, the identity of
  the company, and its remaining developer-relevant properties.
